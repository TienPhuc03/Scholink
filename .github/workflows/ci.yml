name: Scholink CI / CD Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Microservices (Node.js & NestJS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build Microservices
        run: pnpm run build

      - name: Run Unit & Integration Tests
        run: pnpm test

  security-and-secrets:
    name: Secrets & Environment Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets in Commits
        run: |
          echo "Checking for sensitive tokens and plain-text secrets..."
          if grep -rn "JWT_SECRET=.*[a-zA-Z0-9]" --exclude=".env.example" --exclude="*.md" .; then
            echo "::error::Found hardcoded JWT_SECRET in codebase!"
            exit 1
          fi
          echo "Secret check passed."
